<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 78 880 516" role="img" aria-labelledby="title description">
  <title id="title">How the server GPU reaches Jellyfin and Immich</title>
  <desc id="description">The Intel UHD 770 GPU inside the processor is passed through from Proxmox to the Debian virtual machine. Docker maps its render device into Jellyfin and Immich. Quick Sync serves video transcoding; OpenVINO serves search and face recognition.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect x="1" y="79" width="878" height="514" rx="18" fill="#f8fbfa" stroke="#d4e3de" stroke-width="2" />
  <rect x="32" y="102" width="816" height="118" rx="14" fill="#e7f7f1" stroke="#77bfae" stroke-width="2" />
  <text x="54" y="132" fill="#23584c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">PHYSICAL SERVER</text>
  <text x="54" y="159" fill="#173d36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Intel Core i5-14500 with UHD 770 graphics</text>
  <rect x="54" y="175" width="365" height="31" rx="8" fill="#ffffff" stroke="#b3d9cc" />
  <text x="70" y="196" fill="#23584c" font-family="Arial, Helvetica, sans-serif" font-size="16">Media engine: Quick Sync video</text>
  <rect x="433" y="175" width="393" height="31" rx="8" fill="#ffffff" stroke="#b3d9cc" />
  <text x="449" y="196" fill="#23584c" font-family="Arial, Helvetica, sans-serif" font-size="16">GPU compute: OpenVINO jobs</text>
  <path d="M440 220 V280" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="275" y="236" width="330" height="28" rx="10" fill="#f8fbfa" />
  <text x="440" y="255" text-anchor="middle" fill="#49645d" font-family="Arial, Helvetica, sans-serif" font-size="16">PCI passthrough with VFIO</text>
  <rect x="32" y="290" width="816" height="96" rx="14" fill="#ffffff" stroke="#9db8b0" stroke-width="2" />
  <text x="54" y="319" fill="#49645d" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">DEBIAN VM ON PROXMOX</text>
  <text x="54" y="350" fill="#173d36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">The GPU appears at /dev/dri/renderD128</text>
  <text x="54" y="372" fill="#49645d" font-family="Arial, Helvetica, sans-serif" font-size="16">Docker shares /dev/dri and grants the render group permission.</text>
  <path d="M440 386 V420 H226 V447" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M440 420 H654 V447" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="32" y="457" width="390" height="112" rx="14" fill="#e7f7f1" stroke="#77bfae" stroke-width="2" />
  <text x="54" y="487" fill="#23584c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">VIDEO CONTAINERS</text>
  <text x="54" y="516" fill="#173d36" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Jellyfin + Immich server</text>
  <text x="54" y="546" fill="#49645d" font-family="Arial, Helvetica, sans-serif" font-size="16">Quick Sync converts video.</text>
  <rect x="458" y="457" width="390" height="112" rx="14" fill="#ecf1fa" stroke="#9fb6dc" stroke-width="2" />
  <text x="480" y="487" fill="#345584" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">MACHINE LEARNING CONTAINER</text>
  <text x="480" y="516" fill="#1d3558" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Immich machine learning</text>
  <text x="480" y="546" fill="#506482" font-family="Arial, Helvetica, sans-serif" font-size="16">OpenVINO runs search and face jobs.</text>
</svg>
