  <rect x="182" y="260" width="108" height="72" rx="10" fill="#ffffff" stroke="#9db8b0" stroke-width="1" />
  <text x="236" y="310" text-anchor="middle" fill="#173d36" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">2</text>
  <text x="236" y="353" text-anchor="middle" fill="#23584c" font-family="Arial, Helvetica, sans-serif" font-size="15">scratch</text>
  <rect x="312" y="254" width="120" height="110" rx="14" fill="#ffffff" stroke="#9db8b0" stroke-width="2" />
  <rect x="318" y="260" width="108" height="72" rx="10" fill="#ffffff" stroke="#9db8b0" stroke-width="1" />
  <text x="372" y="310" text-anchor="middle" fill="#173d36" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">3</text>
  <text x="372" y="353" text-anchor="middle" fill="#23584c" font-family="Arial, Helvetica, sans-serif" font-size="15">scratch</text>
  <rect x="448" y="254" width="120" height="110" rx="14" fill="#ffffff" stroke="#9db8b0" stroke-width="2" />
  <rect x="454" y="260" width="108" height="72" rx="10" fill="#ffffff" stroke="#9db8b0" stroke-width="1" />
  <text x="508" y="310" text-anchor="middle" fill="#173d36" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">4</text>
  <text x="508" y="353" text-anchor="middle" fill="#23584c" font-family="Arial, Helvetica, sans-serif" font-size="15">scratch</text>
  <rect x="584" y="254" width="120" height="110" rx="14" fill="#ffffff" stroke="#9db8b0" stroke-width="2" />
  <rect x="590" y="260" width="108" height="72" rx="10" fill="#ffffff" stroke="#9db8b0" stroke-width="1" />
  <text x="644" y="310" text-anchor="middle" fill="#173d36" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">5</text>
  <text x="644" y="353" text-anchor="middle" fill="#23584c" font-family="Arial, Helvetica, sans-serif" font-size="15">scratch</text>
  <text x="40" y="404" fill="#49645d" font-family="Arial, Helvetica, sans-serif" font-size="16">Add shift to any of these and the focused window moves there instead of you.</text>
</svg>
